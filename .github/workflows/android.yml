name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compute version
        id: ver
        run: |
          echo "version_name=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionName=${{ steps.ver.outputs.version_name }} -PversionCode=${{ steps.ver.outputs.version_code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: comics-reader-${{ steps.ver.outputs.version_name }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
